<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>You're offline — KACHI TECH</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #12151D 0%, #0A0D13 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      color: #F7F7F5;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
    }
    .mark {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #F5BC53 0%, #D68F26 45%, #3B4FE0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 28px;
      color: #0A0D13;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: rgba(247,247,245,0.6); line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #3B4FE0;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">K</div>
    <h1>You're offline</h1>
    <p>KACHI TECH needs a connection to process payments. Reconnect and we'll pick up right where you left off.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
